<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="masthead-title">
      <h1>Match Log</h1>
      <span class="season">Season 12</span>
    </div>
    <div class="github-status" id="githubStatus">
      <span class="github-dot off" id="githubDot"></span>
      <span id="githubStatusText">Not connected</span>
      <button type="button" id="githubConnectBtn" class="mini-btn">Connect</button>
    </div>
  </header>

  <div class="github-token-row" id="githubTokenRow">
    <input type="password" id="githubTokenInput" placeholder="Paste fine-grained GitHub token">
    <button type="button" id="githubTokenSave" class="mini-btn">Save token</button>
  </div>

  <div class="layout">
  <div class="main-col">

  <section class="panel" aria-labelledby="log-heading">
    <h2 id="log-heading">Log a match</h2>

    <div class="field-row">
      <div class="field">
        <label for="map">Map</label>
        <select id="map">
          <option>Aatlis</option>
          <option>Antarctic Peninsula</option>
          <option>Blizzard World</option>
          <option>Busan</option>
          <option>Circuit Royal</option>
          <option>Colosseo</option>
          <option>Dorado</option>
          <option>Eichenwalde</option>
          <option>Esperança</option>
          <option>Havana</option>
          <option>Hollywood</option>
          <option>Ilios</option>
          <option>Junkertown</option>
          <option>King's Row</option>
          <option>Lijiang Tower</option>
          <option>Midtown</option>
          <option>Nepal</option>
          <option>New Junk City</option>
          <option>New Queen Street</option>
          <option>Neon Junction</option>
          <option>Numbani</option>
          <option>Oasis</option>
          <option>Paraíso</option>
          <option>Rialto</option>
          <option>Route 66</option>
          <option>Runasapi</option>
          <option>Samoa</option>
          <option>Shambali Monastery</option>
          <option>Suravasa</option>
          <option>Watchpoint: Gibraltar</option>
        </select>
      </div>
      <div class="field">
        <label for="hero">Hero</label>
        <select id="hero">
          <option>Anran</option>
          <option>Ashe</option>
          <option>Bastion</option>
          <option>Cassidy</option>
          <option>Echo</option>
          <option>Emre</option>
          <option>Freja</option>
          <option>Genji</option>
          <option>Hanzo</option>
          <option>Junkrat</option>
          <option>Mei</option>
          <option>Pharah</option>
          <option>Reaper</option>
          <option>Shion</option>
          <option>Sierra</option>
          <option>Sojourn</option>
          <option>Soldier: 76</option>
          <option>Sombra</option>
          <option>Symmetra</option>
          <option>Torbjörn</option>
          <option>Tracer</option>
          <option>Vendetta</option>
          <option>Venture</option>
          <option>Widowmaker</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Result</label>
        <div class="result-toggle" id="resultToggle">
          <button type="button" class="result-btn" data-result="Win">Win</button>
          <button type="button" class="result-btn" data-result="Loss">Loss</button>
          <button type="button" class="result-btn" data-result="Tie">Tie</button>
        </div>
      </div>
    </div>

    <div class="rank-readout">
      <div class="field">
        <label for="rank">Rank</label>
        <select id="rank">
          <option>Bronze</option>
          <option>Silver</option>
          <option>Gold</option>
          <option>Platinum</option>
          <option>Emerald</option>
          <option selected>Diamond</option>
          <option>Master</option>
          <option>Grandmaster</option>
          <option>Champion</option>
        </select>
      </div>
      <div class="field">
        <label for="division">Division</label>
        <select id="division">
          <option>5</option>
          <option>4</option>
          <option selected>3</option>
          <option>2</option>
          <option>1</option>
        </select>
      </div>
      <div class="field">
        <label for="percentInput">Percent</label>
        <div class="percent-input-wrap"><input type="number" id="percentInput" min="-99" max="99" placeholder="&mdash;"><span>%</span></div>
      </div>

      <div class="division-progress">
        <div class="meter-label">
          <span id="rangeStartLabel">Gold V</span>
          <span id="rangeEndLabel">Progress to Platinum V</span>
        </div>
        <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
      </div>
    </div>

    <div class="comment-row">
      <div class="field comment-field">
        <label for="good"><span class="dot good"></span>What went well</label>
        <textarea id="good" placeholder="Held the choke, good ult economy..."></textarea>
      </div>
      <div class="field comment-field">
        <label for="bad"><span class="dot bad"></span>What went wrong</label>
        <textarea id="bad" placeholder="Overextended twice, missed picks..."></textarea>
      </div>
    </div>

    <div class="vod-field">
      <label class="vod-checkbox-label" for="vodCheckbox">
        <input type="checkbox" id="vodCheckbox">
        <span>VOD reviewed</span>
      </label>
    </div>

    <div class="form-error" id="formError"></div>

    <div class="save-row">
      <button class="save" id="saveMatchBtn" type="button">Save match</button>
    </div>
  </section>

  <section class="graph-section" aria-labelledby="graph-heading">
    <div class="section-head">
      <h2 id="graph-heading">Rank progress</h2>
      <div class="legend">
        <span>Bronze</span>
        <span class="legend-swatch"></span>
        <span>Champion</span>
      </div>
    </div>

    <div class="range-selector" id="rangeSelector">
      <button class="range-btn" data-range="50">Last 50</button>
      <button class="range-btn active" data-range="250">Last 250</button>
      <button class="range-btn" data-range="500">Last 500</button>
      <button class="range-btn" data-range="max">Max</button>
      <button class="range-btn" data-range="custom">Custom</button>
      <input type="number" id="customRangeInput" class="range-custom-input" min="1" placeholder="games" />
    </div>

    <div class="range-status" id="rangeStatus"></div>

    <div class="graph-panel">
      <svg id="rankSvg" viewBox="0 0 700 260" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="point-tooltip" id="pointTooltip"></div>
  </section>

  </div>

  <div class="side-col">
    <section class="panel table-section" aria-labelledby="table-heading">
      <h2 id="table-heading">Match history</h2>
      <div class="table-wrap">
        <table class="match-table" id="matchTable">
          <thead>
            <tr>
              <th class="num"></th>
              <th class="num">#</th>
              <th>Map</th>
              <th>Hero</th>
              <th>Result</th>
              <th>Rank</th>
              <th class="num">%</th>
              <th class="num">VOD</th>
              <th class="num"></th>
            </tr>
          </thead>
          <tbody id="matchTableBody"></tbody>
        </table>
        <div class="table-empty" id="tableEmpty">No matches logged yet.</div>
      </div>
    </section>
  </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
